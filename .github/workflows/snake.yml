# ─────────────────────────────────────────────────────────────────────────────
# Contribution snake
#
# Renders an animated snake that eats your contribution graph. It writes the
# SVGs to an `output` branch, which the README then references via
# raw.githubusercontent.com — so no binary files ever live on `main`.
#
# After the first successful run you'll have:
#   output/snake.svg        (light)
#   output/snake-dark.svg   (dark)
#
# PAUSED. The automatic triggers below are commented out because the snake is
# not displayed in README.md right now -- a snake tracing an almost-empty
# contribution graph looks worse than no snake at all. Nothing here is broken:
# uncomment the two triggers (see SETUP.md section 4) once your graph has real
# activity. Until then you can still run it by hand from the Actions tab.
# ─────────────────────────────────────────────────────────────────────────────
name: Generate contribution snake

on:
  # PAUSED -- rebuild twice a day so the graph stays fresh
  # schedule:
  #   - cron: "0 0,12 * * *"

  # PAUSED -- rebuild on every push to the default branch
  # push:
  #   branches:
  #     - main

  # Left enabled -- trigger it by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
