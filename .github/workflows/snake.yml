# ─────────────────────────────────────────────────────────────────────────────
# Contribution snake
#
# Renders an animated snake that eats your contribution graph. It writes the
# SVGs to an `output` branch, which the README then references via
# raw.githubusercontent.com — so no binary files ever live on `main`.
#
# After the first successful run you'll have:
#   output/snake.svg        (light)
#   output/snake-dark.svg   (dark)
# ─────────────────────────────────────────────────────────────────────────────
name: Generate contribution snake

on:
  # Rebuild twice a day so the graph stays fresh
  schedule:
    - cron: "0 0,12 * * *"
  # Let you trigger it by hand from the Actions tab
  workflow_dispatch:
  # Rebuild whenever you push to the default branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
